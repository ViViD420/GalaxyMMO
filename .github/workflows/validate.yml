name: Validate project foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol-manifest:
    name: Validate protocol manifest and tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate protocol manifest
        run: python tools/validate_protocol.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
