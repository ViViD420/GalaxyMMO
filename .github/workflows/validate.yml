name: Validate project foundation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-manifest:
    name: Validate protocol manifest and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tooling
        run: python -m compileall -q tools tests
      - name: Validate protocol manifest
        run: python tools/validate_protocol.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
